<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e2e"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#e62e00"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff089"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ff8e26"/>
    </linearGradient>
    <radialGradient id="neon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#neon-glow)"/>

  <!-- Dark Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg-grad)" stroke="#ff6b00" stroke-width="14" stroke-opacity="0.8"/>

  <!-- Subtle Speed Track Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ff8e26" stroke-width="3" stroke-dasharray="16 12" stroke-opacity="0.35"/>

  <!-- Athletic Angled Barbell / Dumbbell -->
  <g transform="rotate(-45 256 256)" filter="url(#glow)">
    <!-- Steel Knurled Grip Bar -->
    <rect x="176" y="238" width="160" height="36" rx="8" fill="url(#gold-grad)" stroke="#0f172a" stroke-width="4"/>
    <!-- Knurling Lines -->
    <line x1="216" y1="242" x2="216" y2="270" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="236" y1="242" x2="236" y2="270" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="242" x2="256" y2="270" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="276" y1="242" x2="276" y2="270" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="296" y1="242" x2="296" y2="270" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Weight Collars & Plates -->
    <rect x="166" y="220" width="14" height="72" rx="4" fill="#94a3b8"/>
    <rect x="116" y="174" width="46" height="164" rx="14" fill="url(#primary-grad)" stroke="#ffe259" stroke-width="5"/>
    <rect x="74" y="142" width="38" height="228" rx="16" fill="url(#primary-grad)" stroke="#ffe259" stroke-width="5"/>
    <rect x="52" y="210" width="18" height="92" rx="6" fill="#64748b"/>

    <!-- Right Weight Collars & Plates -->
    <rect x="332" y="220" width="14" height="72" rx="4" fill="#94a3b8"/>
    <rect x="350" y="174" width="46" height="164" rx="14" fill="url(#primary-grad)" stroke="#ffe259" stroke-width="5"/>
    <rect x="400" y="142" width="38" height="228" rx="16" fill="url(#primary-grad)" stroke="#ffe259" stroke-width="5"/>
    <rect x="442" y="210" width="18" height="92" rx="6" fill="#64748b"/>

    <!-- Energy Lightning Bolt -->
    <path d="M266 150 L232 250 L262 250 L240 362 L290 244 L258 244 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Brand Plate: 147 GYM -->
  <rect x="176" y="408" width="160" height="42" rx="21" fill="#131824" stroke="#ff6b00" stroke-width="3"/>
  <text x="256" y="437" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="22" font-weight="900" fill="#ff9100" text-anchor="middle" letter-spacing="3">147 GYM</text>
</svg>
